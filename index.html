<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Verification</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #f0f0f0; font-family: monospace; }
        #sumsub-websdk-container { width: 100%; height: 100%; }
        #debug-console {
            position: fixed; top: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.8); color: lime;
            padding: 10px; z-index: 9999; white-space: pre-wrap;
            display: none; /* Скрыт по умолчанию, пока нет ошибок */
        }
    </style>
</head>
<body>
    <div id="debug-console"></div>
    <div id="sumsub-websdk-container"></div>

    <!-- 1. Ловец ошибок скрипта -->
    <script>
        function logError(msg) {
            const el = document.getElementById('debug-console');
            el.style.display = 'block';
            el.innerHTML += "🔴 " + msg + "\n";
        }
        window.onerror = function(msg, url, line) {
            logError("JS Error: " + msg + " (Line: " + line + ")");
        };
    </script>

    <!-- 2. Загружаем Sumsub с проверкой -->
    <script src="https://static.sumsub.com/idensic/static/sns-websdk.js" 
            onerror="logError('НЕ ЗАГРУЗИЛСЯ СКРИПТ SUMSUB! Отключите AdBlock или проверьте интернет.')">
    </script>

    <!-- 3. Запуск -->
    <script>
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const accessToken = urlParams.get('token');

            if (!accessToken) {
                logError("Токен не найден в ссылке! Добавьте ?token=ВАШ_ТОКЕН");
            } else if (typeof snsWebSdk === 'undefined') {
                logError("Библиотека snsWebSdk не найдена (скрипт заблокирован?)");
            } else {
                // Пытаемся запустить
                const snsWebSdkInstance = snsWebSdk.init(
                        accessToken, 
                        () => Promise.resolve(accessToken)
                    )
                    .withConf({ lang: 'ru' })
                    .on('idCheck.onError', (error) => {
                        logError("Ошибка Sumsub: " + JSON.stringify(error));
                    })
                    .build();

                snsWebSdkInstance.launch('#sumsub-websdk-container');
            }
        } catch (e) {
            logError("Критическая ошибка запуска: " + e.message);
        }
    </script>
</body>
</html>
