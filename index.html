<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff; }
        #sumsub-websdk-container { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="sumsub-websdk-container"></div>

    <!-- 
      ВМЕСТО кучи файлов со скриншота, мы берем официальный модуль Sumsub v2
      через независимый CDN (esm.sh), который не блокируется AdBlock.
    -->
    <script type="module">
        import snsWebSdk from 'https://esm.sh/@sumsub/websdk@2.0.0';

        // Получаем токен из ?token=...
        const urlParams = new URLSearchParams(window.location.search);
        const accessToken = urlParams.get('token');

        if (accessToken) {
            const snsWebSdkInstance = snsWebSdk.init(
                    accessToken,
                    () => Promise.resolve(accessToken)
                )
                .on('idCheck.onError', (error) => {
                    console.error("Ошибка Sumsub:", error);
                })
                .build();

            snsWebSdkInstance.launch('#sumsub-websdk-container');
        } else {
            document.body.innerHTML = '<h3 style="text-align:center;margin-top:20px;color:red;">В ссылке нет токена (?token=...)</h3>';
        }
    </script>
</body>
</html>
