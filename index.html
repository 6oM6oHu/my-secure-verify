<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #sumsub-websdk-container { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="sumsub-websdk-container"></div>

    <!-- Подключаем Sumsub SDK через незаблокированный CDN -->
    <script type="module">
        import { snsWebSdk } from 'https://esm.sh/@sumsub/websdk@2';

        const urlParams = new URLSearchParams(window.location.search);
        const accessToken = urlParams.get('token');

        if (!accessToken) {
            document.body.innerHTML = '<h2 style="text-align:center; margin-top:50px;">Ошибка: В ссылке нет токена. Используйте формат: ?token=ВАШ_ТОКЕН</h2>';
        } else {
            const snsWebSdkInstance = snsWebSdk.init(
                    accessToken,
                    () => accessToken
                )
                .withConf({
                    lang: 'ru',
                })
                .build();

            snsWebSdkInstance.launch('#sumsub-websdk-container');
        }
    </script>
</body>
</html>
